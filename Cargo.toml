[workspace]
resolver = "2"
members = [
    "crates/ta-core",
    "crates/ta-store",
    "crates/ta-kernel",
    "crates/ta-subscription",
    "crates/ta-secrets",
    "crates/ta-gateway",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["TokenAgency"]
repository = ""

[workspace.dependencies]
# --- 基础 ---
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
serde_path_to_error = "0.1"
schemars = { version = "1", features = ["preserve_order"] }
regex = "1"
once_cell = "1"
indexmap = { version = "2", features = ["serde"] }

# --- 异步 ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "time"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
bytes = "1"

# --- HTTP：入站 ---
axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1", features = ["full"] }
http = "1"
http-body-util = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "cors", "trace"] }

# --- HTTP：出站 ---
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls", "http2", "stream", "json", "gzip", "brotli", "deflate", "socks",
] }
rustls = "0.23"
webpki-roots = "1"

# --- 存储 ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "sqlite", "migrate", "macros", "json", "chrono",
] }

# --- 系统集成 ---
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
dirs = "6"
notify = "8"
sysinfo = "0.33"

# --- 观测 / 工具 ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
backon = { version = "1", features = ["tokio-sleep"] }
arc-swap = "1"
zstd = "0.13"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
nanoid = "0.4"
flate2 = "1"

# --- Tauri ---
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-build = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"
# 注意：specta 2 目前只有 RC，必须显式钉版本（工作包 T1 使用）
#
# ⚠️ `specta` **没有** `typescript` feature —— TS 导出在 `tauri-specta` 的
#    `typescript` / `javascript`（两者是同一 feature 的别名，都指向 `specta-typescript`）后面。
#    把 `typescript` 写在 specta 上会让**任何** `specta = { workspace = true }` 的
#    下游 crate 直接解析失败（员工 E3 做 T1 时撞到，我先撞到了它自己）。
#    权威核对：`cargo info specta@2.0.0-rc.25` / `cargo info tauri-specta@2.0.0-rc.25`。
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# TS 导出的**类型覆盖标记**（`Any` / `Unknown` / `Number` / `BigInt`）。
#
# 必须显式引它，而不是只依赖 tauri-specta 的传递依赖：我们要在 **DTO 定义处**
# （`ta-store`）写 `#[specta(type = Any)]`，那需要它是一个**直接依赖**。
#
# 用途只有一个：`serde_json::Value` 这类**真正任意的 JSON** 字段。
# specta 会拒绝导出 `Value` 里的 `i64`（BigInt 禁令），而这类字段又不可能给出具体类型。
specta-typescript = { version = "=0.0.12", features = ["serde"] }

# --- 测试 ---
insta = { version = "1", features = ["json", "yaml"] }
wiremock = "0.6"
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
incremental = false

# 网关热路径单独提优化等级（体积换速度，只影响这一个 crate）
[profile.release.package.ta-gateway]
opt-level = 3

[profile.dev]
# 依赖用 O1 编译，避免 dev 下网关慢到没法调试
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# **验证用快速 profile**：给真机 E2E 迭代替换 `release`（功能一致，构建快数倍）。
# 为什么不用 `dev`：本仓库的 `dev` 是 optimized + debuginfo，构建并不快；这里显式关掉优化与调试信息。
[profile.verify]
inherits = "dev"
opt-level = 0
debug = false
incremental = true
lto = false
codegen-units = 256
