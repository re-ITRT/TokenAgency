# ============================================================================
# TokenAgency 配置示例  —— 本文件由 scripts/gen-example-config.ps1 生成，请勿手改
# ============================================================================
#
# 唯一真源是 Rust 类型（crates/ta-core/src/config/defaults.rs）。
# 字段含义与选型理由见 docs/02-config-and-data-model.md，不要在本文件里写长注释
# —— 手写注释必然与类型漂移，这正是本文件改成生成物的原因。
#
# 用法：
#   默认模式（SQLite 为真源）：ta import config.example.yaml
#   文件监听模式：设置里开启后，以复制出来的 YAML 为真源，改动热重载
#
# 密钥一律用 ${secret:name} / ${env:VAR}，不要写明文
#   （git pre-commit 会拦截疑似明文 key，见 .githooks/pre-commit）
#
# 重新生成：
#   pwsh -File scripts/gen-example-config.ps1
#
# 防漂移：crates/ta-core/tests/example_config_guard.rs 会断言本文件能被当前类型读通，
#         且不含任何落进 extra 的失效字段。改结构体忘了重新生成 → CI 直接红。
# ============================================================================
version: 1
gateway:
  listen: 127.0.0.1:8787
  admin_listen: 127.0.0.1:8788
  local_key: ${secret:gateway-local-key}
  max_body_mb: 32
  debug_headers: true
  expose_models_with_capabilities: false
  fallback_provider: null
  passthrough:
    header_mode: pass
    body: preserve
    strip_hop_by_hop: true
    verify_no_diff: true
    on_loss: reject
  retry:
    max_attempts: 3
    stream_max_attempts: 2
    retry_after_first_byte: false
    cooldown_s: 120
    backoff: exponential
  metering:
    inject_stream_usage: false
request_log:
  mode: meta
  retention: 30d
  max_rows: 500000
  max_size_mb: 2048
  sample_rate: 1.0
  image_handling: hash
pricing:
  currency: USD
  unit: per_1m
  usd_to_cny: 7.25
  entries:
  - match:
      model: claude-sonnet-4-5
      provider: p-anthropic
      credential: null
    rates:
      input: 3.0
      input_cache_write: 3.75
      input_cache_write_1h: 6.0
      input_cached: 0.3
      output: 15.0
    multiplier: 1.0
    currency: null
    plan_fee: null
    source: builtin
    effective_from: null
  - match:
      model: gpt-4o*
      provider: null
      credential: null
    rates:
      input: 2.5
      input_cached: 1.25
      output: 10.0
    multiplier: 1.0
    currency: null
    plan_fee: null
    source: builtin
    effective_from: null
  - match:
      model: null
      provider: p-mytoken
      credential: null
    rates: {}
    multiplier: 0.8
    currency: null
    plan_fee: null
    source: manual
    effective_from: null
  - match:
      model: null
      provider: null
      credential: c-relay-a
    rates: {}
    multiplier: 1.0
    currency: null
    plan_fee:
      amount: 99.0
      currency: CNY
      window: month
    source: builtin
    effective_from: null
net:
  kernel:
    provider: external
    path: null
    controller: 127.0.0.1:39090
    lane_port_range:
    - 39100
    - 39299
    subscription_source: kernel
  dialer: kernel
  dns:
    enhanced_mode: redir-host
    nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    proxy_server_nameserver:
    - https://223.5.5.5/dns-query
    default_nameserver:
    - 223.5.5.5
    - 119.29.29.29
  health:
    interval_s: 60
    url_by_provider: true
    probe_url: null
  default_lane: lane-direct
  system_proxy: false
  tun: false
proxy_subscriptions:
- id: sub-jp
  name: 机场A
